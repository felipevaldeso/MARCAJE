<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monitor de Marcaje - CESFAM</title>
<style>
  :root {
    --primary: #6366f1;
    --primary-dark: #4f46e5;
    --success: #10b981;
    --danger: #ef4444;
    --warning: #f59e0b;
    --bg-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
    --card-bg: rgba(255, 255, 255, 0.95);
    --text-main: #1e293b;
    --text-muted: #64748b;
    --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
  }

  * { margin:0; padding:0; box-sizing:border-box; }
  
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background: var(--bg-gradient);
    color: var(--text-main);
    min-height: 100vh;
    padding: 20px;
    line-height: 1.5;
  }

  .container { max-width: 1000px; margin: 0 auto; }

  /* Header */
  .header {
    background: var(--card-bg);
    border-radius: 20px;
    padding: 30px;
    box-shadow: var(--shadow);
    text-align: center;
    margin-bottom: 24px;
    border: 1px solid white;
  }
  .header h1 { 
    font-size: 2rem; 
    font-weight: 800; 
    background: linear-gradient(to right, #4f46e5, #9333ea);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }
  .header p { color: var(--text-muted); font-weight: 500; }

  /* Dashboard Card */
  .card {
    background: var(--card-bg);
    border-radius: 24px;
    padding: 32px;
    box-shadow: var(--shadow);
    backdrop-filter: blur(10px);
    border: 1px solid white;
  }

  /* Navigation */
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 24px;
    gap: 12px;
  }
  .nav-btn {
    background: white;
    border: 1px solid #e2e8f0;
    padding: 10px 20px;
    border-radius: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    color: var(--text-main);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .nav-btn:hover:not(:disabled) {
    background: #f1f5f9;
    border-color: var(--primary);
    transform: translateY(-1px);
  }
  .nav-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .mes-label { font-size: 1.5rem; font-weight: 800; color: var(--text-main); }

  /* Action Buttons */
  .actions {
    display: flex;
    justify-content: center;
    gap: 12px;
    margin-bottom: 24px;
    flex-wrap: wrap;
  }
  .btn-action {
    border: none;
    padding: 12px 20px;
    border-radius: 12px;
    font-weight: 600;
    font-size: 0.9rem;
    cursor: pointer;
    transition: all 0.2s;
    display: flex;
    align-items: center;
    gap: 8px;
    color: white;
  }
  .btn-refresh { background: var(--primary); }
  .btn-gmail { background: #ea4335; }
  .btn-action:hover { opacity: 0.9; transform: scale(1.02); }
  .btn-action:active { transform: scale(0.98); }

  /* Stats Container */
  .stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 16px;
    margin-bottom: 32px;
  }
  .stat-card {
    background: #f8fafc;
    padding: 16px;
    border-radius: 16px;
    text-align: center;
    border: 1px solid #f1f5f9;
  }
  .stat-card .val { font-size: 1.8rem; font-weight: 800; display: block; }
  .stat-card .lbl { font-size: 0.75rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }
  .stat-verde { color: var(--success); }
  .stat-naranjo { color: var(--warning); }
  .stat-rojo { color: var(--danger); }
  .stat-turno { color: var(--primary); }

  /* Calendar */
  .calendar-header {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    margin-bottom: 12px;
  }
  .calendar-header div {
    text-align: center;
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--text-muted);
    text-transform: uppercase;
  }

  .calendar-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 10px;
  }

  .day-cell {
    aspect-ratio: 1;
    background: white;
    border-radius: 14px;
    border: 1px solid #f1f5f9;
    padding: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    position: relative;
    cursor: pointer;
    transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  }
  .day-cell:hover:not(.empty) {
    transform: translateY(-4px);
    box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
    border-color: var(--primary);
  }
  .day-cell.empty { background: transparent; border: none; cursor: default; }
  .day-cell.inactive { background: #f8fafc; opacity: 0.4; }
  .day-cell.today { border: 2px solid var(--primary); background: #eef2ff; }

  .day-num { font-weight: 800; font-size: 1rem; }
  
  .status-dots { display: flex; gap: 4px; margin-bottom: 4px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; border: 2px solid white; box-shadow: 0 0 0 1px #e2e8f0; }
  .dot.ok { background: var(--success); }
  .dot.err { background: var(--danger); }

  .star-icon { position: absolute; top: 4px; right: 4px; font-size: 0.8rem; }

  /* Info Banners */
  .status-banner {
    padding: 12px;
    border-radius: 12px;
    margin-bottom: 20px;
    text-align: center;
    font-size: 0.9rem;
    font-weight: 600;
    animation: fadeIn 0.3s ease;
  }
  .banner-loading { background: #eff6ff; color: #1d4ed8; }
  .banner-error { background: #fef2f2; color: #b91c1c; }
  .banner-ok { background: #ecfdf5; color: #047857; }

  /* Detail Panel */
  #detailPanel {
    display: none;
    margin-top: 24px;
    padding: 20px;
    border-radius: 16px;
    background: #f1f5f9;
    border-left: 6px solid var(--primary);
    position: relative;
    animation: slideUp 0.3s ease;
  }
  .close-panel { position: absolute; top: 12px; right: 16px; cursor: pointer; font-weight: bold; color: var(--text-muted); }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  @media (max-width: 600px) {
    body { padding: 10px; }
    .card { padding: 16px; }
    .mes-label { font-size: 1.1rem; }
    .day-num { font-size: 0.9rem; }
    .dot { width: 8px; height: 8px; }
  }
</style>
</head>
<body>

<div class="container">
  <header class="header">
    <h1>📊 Monitor de Marcaje</h1>
    <p>CESFAM Quinta Bella · Sincronización en Tiempo Real</p>
  </header>

  <main class="card">
    <!-- Navegación de Meses -->
    <nav class="nav">
      <button class="nav-btn" onclick="changeMonth(-1)"><span>⬅</span> Anterior</button>
      <div class="mes-label" id="mesLabel">Cargando...</div>
      <button class="nav-btn" onclick="changeMonth(1)">Siguiente <span>➡</span></button>
    </nav>

    <!-- Acciones -->
    <div class="actions">
      <button class="btn-action btn-refresh" onclick="loadData()">🔄 Actualizar Calendario</button>
      <button class="btn-action btn-gmail" id="btnGmail" onclick="syncWithGmail()">📧 Sincronizar Gmail</button>
    </div>

    <!-- Estado -->
    <div id="statusBanner" class="status-banner banner-loading">Iniciando sistema...</div>

    <!-- Estadísticas -->
    <div class="stats-grid" id="statsGrid" style="display:none;">
      <div class="stat-card"><span class="val stat-verde" id="stOk">0</span><span class="lbl">Completos</span></div>
      <div class="stat-card"><span class="val stat-naranjo" id="stPartial">0</span><span class="lbl">Parciales</span></div>
      <div class="stat-card"><span class="val stat-rojo" id="stFail">0</span><span class="lbl">Faltantes</span></div>
      <div class="stat-card"><span class="val stat-turno" id="stTurnos">0</span><span class="lbl">Turnos ⭐</span></div>
    </div>

    <!-- Calendario -->
    <div class="calendar-header">
      <div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div><div>Vie</div><div>Sáb</div><div>Dom</div>
    </div>
    <div class="calendar-grid" id="calendarGrid"></div>

    <!-- Detalle -->
    <section id="detailPanel">
      <span class="close-panel" onclick="closeDetail()">✕</span>
      <h3 id="detDate" style="margin-bottom:10px;">-</h3>
      <p id="detIn">Entrada: -</p>
      <p id="detOut">Salida: -</p>
      <p id="detNote" style="margin-top:8px; font-weight:600; color:var(--primary);"></p>
    </section>
  </main>
</div>

<script>
/** CONFIGURACIÓN **/
const SHEET_ID = '1YYinKuQsaxtthSRHYe1k9qTObUXWV-NWunG2qFfjtew';
const APP_URL = 'https://script.google.com/macros/s/AKfycbyHmvG3s3xWfAoF6ol53ijtbQnfjJcvklNf9dGh61wEXV0JZlkS0WZxJez7Cbp8kdtz6w/exec';
const MONTHS = ["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

let currentViewDate = new Date();
let registry = {}; 
let trackedDays = new Set();

/** LÓGICA DE DATOS **/

async function fetchSheetData(sheetName) {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(sheetName)}`;
  try {
    const res = await fetch(url);
    const text = await res.text();
    const json = JSON.parse(text.substring(text.indexOf('(') + 1, text.lastIndexOf(')')));
    if (json.status === 'error') return null;
    return json.table.rows.map(row => row.c.map(cell => cell ? (cell.v || '') : ''));
  } catch (e) {
    return null;
  }
}

// Función robusta para parsear fechas de Google Sheets
function parseGoogleDate(val) {
  if (!val) return null;
  let d, m, a;
  
  if (val.toString().includes('Date(')) {
    const parts = val.match(/\d+/g);
    a = parts[0];
    m = parseInt(parts[1]) + 1;
    d = parts[2];
  } else {
    const parts = val.toString().split('/');
    if (parts.length !== 3) return null;
    [d, m, a] = parts;
  }
  return `${d.toString().padStart(2,'0')}/${m.toString().padStart(2,'0')}/${a}`;
}

async function loadData() {
  const year = currentViewDate.getFullYear();
  const monthIdx = currentViewDate.getMonth();
  const monthName = MONTHS[monthIdx];
  
  // UI Reset
  document.getElementById('mesLabel').textContent = `${monthName} ${year}`;
  const banner = document.getElementById('statusBanner');
  banner.className = 'status-banner banner-loading';
  banner.textContent = `Consultando datos de ${monthName}...`;
  document.getElementById('calendarGrid').innerHTML = '';
  document.getElementById('statsGrid').style.display = 'none';
  closeDetail();

  registry = {};
  trackedDays.clear();

  // 1. Cargar Marcajes
  const marcajesRows = await fetchSheetData(`Marcajes-${monthName}-${year}`);
  if (marcajesRows) {
    marcajesRows.forEach(row => {
      const fecha = parseGoogleDate(row[0]);
      if (!fecha) return;
      
      registry[fecha] = {
        in: row[4]?.toString().includes('Registrado'),
        out: row[5]?.toString().includes('Registrado'),
        timeIn: row[2],
        timeOut: row[3],
        isTurno: row[6]?.toString().toUpperCase().includes('TURNO')
      };
      trackedDays.add(fecha);
    });
  }

  // 2. Cargar Alertas (para complementar turnos)
  const alertaRows = await fetchSheetData(`Alertas-${monthName}-${year}`);
  if (alertaRows) {
    alertaRows.forEach(row => {
      const rawFecha = row[2]?.toString().split(' ')[0];
      const fecha = parseGoogleDate(rawFecha);
      if (!fecha) return;
      
      trackedDays.add(fecha);
      if (!registry[fecha]) registry[fecha] = { in: false, out: false, isTurno: false };
      if (row[1]?.toString().includes('TURNO') || row[4]?.toString().includes('TURNO')) {
        registry[fecha].isTurno = true;
      }
    });
  }

  if (trackedDays.size === 0) {
    banner.className = 'status-banner banner-error';
    banner.textContent = `⚠️ No se encontraron registros para este periodo.`;
  } else {
    banner.className = 'status-banner banner-ok';
    banner.textContent = `✅ Datos actualizados a las ${new Date().toLocaleTimeString()}`;
  }

  renderCalendar(year, monthIdx);
  updateStats();
}

function renderCalendar(year, monthIdx) {
  const grid = document.getElementById('calendarGrid');
  const firstDay = new Date(year, monthIdx, 1).getDay();
  const offset = firstDay === 0 ? 6 : firstDay - 1;
  const daysInMonth = new Date(year, monthIdx + 1, 0).getDate();
  const today = new Date();

  // Celdas vacías mes anterior
  for (let i = 0; i < offset; i++) {
    const div = document.createElement('div');
    div.className = 'day-cell empty';
    grid.appendChild(div);
  }

  for (let d = 1; d <= daysInMonth; d++) {
    const dateStr = `${d.toString().padStart(2,'0')}/${(monthIdx+1).toString().padStart(2,'0')}/${year}`;
    const info = registry[dateStr];
    const isTracked = trackedDays.has(dateStr);
    
    const cell = document.createElement('div');
    cell.className = 'day-cell';
    if (isTracked) {
      if (today.getDate() === d && today.getMonth() === monthIdx && today.getFullYear() === year) {
        cell.classList.add('today');
      }
      
      cell.innerHTML = `
        <span class="day-num">${d}</span>
        <div class="status-dots">
          <div class="dot ${info.in ? 'ok' : 'err'}"></div>
          <div class="dot ${info.out ? 'ok' : 'err'}"></div>
        </div>
        ${info.isTurno ? '<span class="star-icon">⭐</span>' : ''}
      `;
      cell.onclick = () => showDetail(dateStr, info);
    } else {
      cell.classList.add('inactive');
      cell.innerHTML = `<span class="day-num">${d}</span>`;
    }
    grid.appendChild(cell);
  }
}

function updateStats() {
  let ok = 0, partial = 0, fail = 0, turnos = 0;
  trackedDays.forEach(date => {
    const d = registry[date];
    if (d.in && d.out) ok++;
    else if (d.in || d.out) partial++;
    else fail++;
    if (d.isTurno) turnos++;
  });

  document.getElementById('stOk').textContent = ok;
  document.getElementById('stPartial').textContent = partial;
  document.getElementById('stFail').textContent = fail;
  document.getElementById('stTurnos').textContent = turnos;
  document.getElementById('statsGrid').style.display = 'grid';
}

function showDetail(date, info) {
  const panel = document.getElementById('detailPanel');
  document.getElementById('detDate').textContent = `📅 Detalle: ${date}`;
  document.getElementById('detIn').textContent = `Entrada: ${info.in ? '✅ ' + (info.timeIn || 'Registrada') : '❌ Pendiente'}`;
  document.getElementById('detOut').textContent = `Salida: ${info.out ? '✅ ' + (info.timeOut || 'Registrada') : '❌ Pendiente'}`;
  document.getElementById('detNote').textContent = info.isTurno ? '🌟 Jornada con Turno Especial' : '';
  panel.style.display = 'block';
  panel.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function closeDetail() {
  document.getElementById('detailPanel').style.display = 'none';
}

function changeMonth(delta) {
  currentViewDate.setMonth(currentViewDate.getMonth() + delta);
  loadData();
}

/** INTEGRACIÓN CON WEB APP (GMAIL) **/

async function syncWithGmail() {
  const btn = document.getElementById('btnGmail');
  const banner = document.getElementById('statusBanner');
  
  btn.disabled = true;
  btn.textContent = '⏳ Sincronizando...';
  banner.className = 'status-banner banner-loading';
  banner.textContent = 'Buscando marcajes nuevos en tu Gmail...';

  const callbackName = 'jsonp_' + Math.round(Math.random() * 100000);
  
  const script = document.createElement('script');
  script.src = `${APP_URL}?accion=actualizar&callback=${callbackName}`;
  
  window[callbackName] = (data) => {
    delete window[callbackName];
    document.body.removeChild(script);
    if (data.success) {
      loadData();
    } else {
      banner.className = 'status-banner banner-error';
      banner.textContent = 'Error: ' + data.mensaje;
      btn.disabled = false;
      btn.textContent = '📧 Sincronizar Gmail';
    }
  };

  script.onerror = () => {
    banner.className = 'status-banner banner-error';
    banner.textContent = 'Error crítico de conexión con el servidor.';
    btn.disabled = false;
  };

  document.body.appendChild(script);
}

// Iniciar
loadData();
</script>

</body>
</html>
